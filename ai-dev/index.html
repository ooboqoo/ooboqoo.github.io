  <!-- KaTeX + auto-render (renders math found in the DOM) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script>
    window.addEventListener('load', () => {
      // Render math in preview. Delimiters: $$...$$ for display, \(..\) for inline
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.querySelector('#md'), {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "\\(", right: "\\)", display: false}
          ],
          throwOnError: false
        });
      }
    });
  </script>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    window.addEventListener('load', () => {
      console.log('render mermaid')
      const mermaidBlocks = document.querySelector('#md').querySelectorAll('code.language-mermaid');
      mermaidBlocks.forEach((block, i) => {
        const code = block.textContent;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.innerHTML = code;
        block.parentNode.replaceWith(div);
      });
      mermaid.init();
    });
  </script>
